name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main", "pre-release"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Prepare Pages content
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          rm -rf public/${BRANCH_NAME}
          mkdir -p public/${BRANCH_NAME}
          cp -r doc public/${BRANCH_NAME}/
          cp -r simulator public/${BRANCH_NAME}/
          cp -r api public/${BRANCH_NAME}/
          cp -r integration_kits public/${BRANCH_NAME}/
          find "public/${BRANCH_NAME}" -maxdepth 5 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  check-pages-smoke:
    name: Check deployed Pages smoke
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployed Python API page is reachable
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          url="${PAGE_URL%/}/${BRANCH_NAME}/doc/api/python/index.html"
          echo "Checking $url"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$url" -o page.html; then
              grep -F "eviDense Python API" page.html
              exit 0
            fi
            sleep 5
          done
          echo "Deployed page did not become reachable in time"
          exit 1

  check-links:
    name: Check markdown links
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .github/workflows/lychee.toml --no-progress --insecure --format detailed "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-markdown-local-links:
    name: Check markdown local links
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check local markdown links
        run: python .github/workflows/check_markdown_local_links.py

  check-markdown-markers:
    name: Check markdown markers
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check for unreplaced markdown markers
        run: |
          if matches="$(find . -type f -name '*.md' -exec grep -Hn -E '__[A-Z0-9_]+__' {} +)"; then
            printf '\033[31mERROR: Found unreplaced markdown markers:\033[0m\n'
            printf '%s\n' "$matches"
            exit 1
          fi

  check-c-cli-via-simulator:
    name: Check C CLI via simulator
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git libusb-1.0-0-dev pkg-config

      - name: Install Python dependencies
        run: python -m pip install pyserial simulator/dist/*.whl

      - name: Build C CLI
        run: |
          cmake -S api/c -B build/c
          cmake --build build/c -j"$(nproc)"

      - name: Run C CLI against simulator
        run: |
          cleanup() {
            python -m hse.simulator sim EXIT >/dev/null 2>&1 || true
            if [ -n "${SIM_PID:-}" ]; then
              wait "$SIM_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          python -m hse.simulator --no-web evidense > simulator.log 2>&1 &
          SIM_PID=$!
          for i in $(seq 1 60); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=1).close()" && break
            if [ "$i" -eq 60 ]; then
              echo "Simulator did not start within 30 seconds"
              exit 1
            fi
            sleep 0.5
          done
          ./build/c/evidense-cli --device SIMULATION get 1 | tee c-serial.txt
          grep -Fx "SIMULATOR" c-serial.txt

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c-cli-via-simulator-artifacts
          path: |
            simulator.log
            c-serial.txt

  check-python-source-via-simulator:
    name: Check Python source via simulator
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install pyserial

      - name: Run Python source against simulator
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/simulator/src:$GITHUB_WORKSPACE/api/python/src"
          cleanup() {
            python -m hse.simulator sim EXIT >/dev/null 2>&1 || true
            if [ -n "${SIM_PID:-}" ]; then
              wait "$SIM_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          python -m hse.simulator --no-web evidense > simulator.log 2>&1 &
          SIM_PID=$!
          for i in $(seq 1 60); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=1).close()" && break
            if [ "$i" -eq 60 ]; then
              echo "Simulator did not start within 30 seconds"
              exit 1
            fi
            sleep 0.5
          done
          python -c "from hse.evidense.device import Device; dev = Device('SIMULATION'); print(dev.serial_number()); dev.close()" | tee python-source-serial.txt
          grep -Fx "SIMULATOR" python-source-serial.txt

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-source-via-simulator-artifacts
          path: |
            simulator.log
            python-source-serial.txt

  check-python-wheel-via-simulator:
    name: Check Python wheel via simulator
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install pyserial simulator/dist/*.whl api/python/dist/*.whl

      - name: Run Python wheel against simulator
        run: |
          cleanup() {
            python -m hse.simulator sim EXIT >/dev/null 2>&1 || true
            if [ -n "${SIM_PID:-}" ]; then
              wait "$SIM_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          python -m hse.simulator --no-web evidense > simulator.log 2>&1 &
          SIM_PID=$!
          for i in $(seq 1 60); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=1).close()" && break
            if [ "$i" -eq 60 ]; then
              echo "Simulator did not start within 30 seconds"
              exit 1
            fi
            sleep 0.5
          done
          python -c "from hse.evidense.device import Device; dev = Device('SIMULATION'); print(dev.serial_number()); dev.close()" | tee python-wheel-serial.txt
          grep -Fx "SIMULATOR" python-wheel-serial.txt

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-via-simulator-artifacts
          path: |
            simulator.log
            python-wheel-serial.txt

  check-csharp-build:
    name: Check C# build
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore C# solution
        run: dotnet restore api/csharp/eviDense.sln

      - name: Build C# solution
        run: dotnet build api/csharp/eviDense.sln --configuration Release --no-restore
